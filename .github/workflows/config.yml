name: UI Tests

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Run UI-tests via docker compose
        env:
          LOGIN: ${{ secrets.LOGIN }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          docker compose up --exit-code-from regression --abort-on-container-exit || true

      - name: Generate Allure report
        if: always()
        run: |
          docker compose run --rm regression /bin/sh -c "allure generate allure-results --clean -o allure-report"
          ls -la allure-report || echo "no report"

      - name: Get Allure history
        uses: actions/checkout@v5
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Allure history
        if: always()
        run: |
          mkdir -p allure-report/history
          cp -r gh-pages/history/* allure-report/history/ 2>/dev/null || echo "No history found"

      - name: Allow main branch to deploy to github-pages
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking deployment branches for github-pages..."
          gh api repos/${{ github.repository }}/environments/github-pages/deployment-branch-policies --jq '.branch_policies[].name' || true
          # Добавляем main в разрешенные ветки, если его нет (фикс Branch "main" is not allowed)
          gh api repos/${{ github.repository }}/environments/github-pages/deployment-branch-policies -f name=main -f type=branch 2>&1 | head -n 20 || echo "main already allowed or cannot add"

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
          # только один артефакт с именем github-pages - фикс ошибки "Multiple artifacts named github-pages were unexpectedly found. Artifact count is 2"
          name: github-pages

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
